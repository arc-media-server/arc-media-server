[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.10.0"
coreKtx = "1.19.1"
media3 = "1.11.1"
okhttp = "5.5.1"
