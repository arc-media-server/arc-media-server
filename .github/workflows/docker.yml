# Builds the Docker image on every push to main (and by hand from the Actions tab), for normal PCs
# and servers (amd64) and ARM boards like the Raspberry Pi (arm64), and pushes it to GitHub's
# container registry as ghcr.io/<owner>/arc-media-server:latest (and :<commit>).
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build web app (includes TypeScript check)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install FFmpeg for media integration tests
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
      - name: Analyse Go code
        run: go vet ./...
      - name: Run tests
        run: go test ./... -timeout 10m
      - name: Check concurrent code
        if: runner.os == 'Linux'
        run: go test -race ./... -timeout 15m
      - name: Build server with embedded web app
        run: go build ./cmd/ams
      - name: Install browser for regression tests
        timeout-minutes: 5
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Check browser tests
        if: runner.os == 'Linux'
        working-directory: web
        run: npx tsc -p e2e/tsconfig.json
      - name: Run browser journeys against isolated Arc server
        if: runner.os == 'Linux'
        working-directory: web
        run: npm run test:e2e:only
      - name: Save browser report and failure evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
  container-smoke:
    name: Container installation and persistence
    env:
      EXPECTED_REVISION: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: arc-readiness:local
          build-args: GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=readiness
          cache-to: type=gha,scope=readiness,mode=max
      - name: Verify installation, read-only media, restore and persistence
        run: node tools/docker-smoke.mjs arc-readiness:local
      - name: Sign in to read the previous tested image
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify upgrade and full-directory rollback from previous image
        if: github.event_name != 'pull_request'
        env:
          PREVIOUS_IMAGE: ghcr.io/jonzauk/arc-media-server:2a7029a1a0871a459424336146a9fdb73c107001
        run: |
          docker pull "$PREVIOUS_IMAGE"
          node tools/docker-smoke.mjs arc-readiness:local "$PREVIOUS_IMAGE"
  # Prepare both architectures while verification runs. Push by digest only: no usable
  # release tag moves until the publish job has seen every verification gate pass.
  build:
    name: Prepare release images
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish verified images
    needs: [checks, container-smoke, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the prepared image without rebuilding
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$IMAGE"
          test -n "$DIGEST"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$REVISION" \
            "$IMAGE@$DIGEST"
