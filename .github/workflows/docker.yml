# Development pushes publish as soon as compilation/image building succeeds. Full verification
# gates version tags and explicit manual verification; latest is the owner's development image.
# Pull requests run nothing here (owner, 26 October): agents run checks locally and the owner tests.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full_verification:
        description: Run the full verification suite before publishing
        type: boolean
        default: true

concurrency:
  group: arc-image-${{ github.ref }}-${{ github.event_name }}-${{ inputs.full_verification || false }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_verification)
    # Linux only (owner, 26 October): Arc isn't run on Windows for now.
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build web app (includes TypeScript check)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install FFmpeg for media integration tests
        timeout-minutes: 5
        run: bash tools/ci/install-media-deps.sh
      - name: Analyse Go code
        run: go vet ./...
      - name: Run tests
        run: go test ./... -timeout 10m
      - name: Check concurrent code
        run: go test -race ./... -timeout 15m
      - name: Build server with embedded web app
        run: go build ./cmd/ams
      - name: Install browser for regression tests
        timeout-minutes: 5
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Check browser tests
        working-directory: web
        run: npx tsc -p e2e/tsconfig.json
      - name: Run browser journeys against isolated Arc server
        working-directory: web
        run: npm run test:e2e:only
      - name: Save browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
  container-smoke:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_verification)
    name: Container installation and persistence
    env:
      EXPECTED_REVISION: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: arc-readiness:local
          build-args: GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=readiness
          cache-to: type=gha,scope=readiness,mode=max
      - name: Verify installation, read-only media, restore and persistence
        run: node tools/docker-smoke.mjs arc-readiness:local
      - name: Sign in to read the previous tested image
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify upgrade and full-directory rollback from previous image
        if: github.event_name != 'pull_request'
        # The older image the upgrade/rollback check starts from. It was published before the repository
        # moved to the arc-media-server organisation, so it lives in the owner's personal package; the
        # package grants this repository read access (docs/IMAGE-PUBLISHING.md). If that access is
        # missing the pull fails and nothing is published: the gate never passes without the check.
        env:
          PREVIOUS_IMAGE: ghcr.io/jonzauk/arc-media-server:2a7029a1a0871a459424336146a9fdb73c107001
        run: |
          docker pull "$PREVIOUS_IMAGE"
          node tools/docker-smoke.mjs arc-readiness:local "$PREVIOUS_IMAGE"
  # Build once for both architectures. The publish job applies the selected verification policy.
  build:
    name: Build images
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish images
    needs: [checks, container-smoke, build]
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' &&
          ((needs.checks.result == 'success' && needs.container-smoke.result == 'success') ||
           (needs.checks.result == 'skipped' && needs.container-smoke.result == 'skipped' &&
            ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
             (github.event_name == 'workflow_dispatch' && !inputs.full_verification)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the prepared image without rebuilding
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$IMAGE"
          test -n "$DIGEST"
          tags=(--tag "$IMAGE:$REVISION")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Version tag is not a valid container tag" >&2
              exit 1
            fi
            tags+=(--tag "$IMAGE:$version")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
